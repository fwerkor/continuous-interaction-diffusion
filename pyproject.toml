[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continuous-interaction-diffusion"
version = "0.1.0"
description = "Reference implementation of Continuous Interaction Diffusion (CID)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Yuhang Cao"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.4"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
cid = "cid.cli:main"

[project.urls]
Repository = "https://github.com/fwerkor/continuous-interaction-diffusion"
Paper = "https://github.com/fwerkor/continuous-interaction-diffusion-paper"

[tool.hatch.build.targets.wheel]
packages = ["src/cid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
