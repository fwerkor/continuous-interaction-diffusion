name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: >-
          pytest
          tests/test_torch_core.py
          tests/test_illada_adapter.py
          tests/test_lfm_adapter.py
          tests/test_encoding_contract.py
          tests/test_cli_stage_b.py
          tests/test_diffusion.py
          tests/test_materialize.py
          tests/test_neural_policy.py
          tests/test_training.py
